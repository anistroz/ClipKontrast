# Builds the Windows app (ClipKontrast-Setup.exe), installs it on a fresh Windows machine and tests it, including
# "Update now". Publishing it (only if every test passed) makes the installed apps offer "Update now" within hours.
#
#   Publish a new version:   Actions -> Windows app -> Run workflow, a new version number, tick "publish"
#                            (or push a tag like v2026.11.20.1)
#   What's new:              only the "notes" typed here are shown to people in the app's update window. Write them
#                            for clippers, about the clip maker. Changes to the website, the admin pages or the
#                            build are never listed (commit messages are not used).
#   Just build and test it:  the same without "publish" (the installer is kept as a download for 14 days)
name: Windows app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version number, higher than the last one, like 2026.11.20.1"
        required: true
        default: "0.0.1"
      publish:
        description: "Publish it to everyone (only if every test passes)"
        type: boolean
        default: false
      notes:
        description: "What's new, shown to clippers in the app. One line each, separated by |. Only clip-maker changes they will notice. Empty shows none."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: windows-app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version and what's new
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") { $v = "${{ github.ref_name }}".TrimStart("v") } else { $v = "${{ inputs.version }}" }
          if ($v -notmatch '^\d+(\.\d+){1,5}$') { throw "The version must be numbers with dots, like 2026.11.19.1 (got '$v')" }
          "CK_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # What's new: only the lines typed in "notes" (never commit messages, which also describe the website,
          # the admin pages and the build: none of that is for the people using the app).
          $notes = @("${{ inputs.notes }}".Split("|") | ForEach-Object { $_.Trim() } | Where-Object { $_ } | Select-Object -First 8)
          $notes | Set-Content -Encoding utf8 release-notes.txt
          $body = if ($notes.Count) { $notes | ForEach-Object { "- $_" } } else { "ClipKontrast $v" }
          $body | Set-Content -Encoding utf8 release-body.txt
          "What's new in the app:"; Get-Content release-notes.txt
          exit 0

      - name: Build the installer
        shell: pwsh
        run: ./packaging/windows/build.ps1 -Version $env:CK_VERSION

      - name: The Mac and Linux download
        shell: pwsh
        run: |
          # the zip carries its version, so a copy from it can tell when a newer one is out
          Set-Content -Path VERSION -Value $env:CK_VERSION -NoNewline
          git archive --format=zip --prefix=ClipKontrast/ --add-file=VERSION -o dist/ClipKontrast-Mac-Linux.zip HEAD
          Get-Item dist/ClipKontrast-Mac-Linux.zip | Format-Table Name, Length

      - name: Install it on this machine and test it
        shell: pwsh
        timeout-minutes: 25
        run: ./packaging/windows/smoke-test.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: ClipKontrast-${{ env.CK_VERSION }}
          path: dist/*
          retention-days: 14

      - name: Publish
        if: github.ref_type == 'tag' || inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        # makes the tag itself when started by hand
        run: gh release create "v$env:CK_VERSION" dist/ClipKontrast-Setup.exe dist/ClipKontrast-app.zip dist/ClipKontrast-Mac-Linux.zip dist/latest.json --target "${{ github.sha }}" --title "ClipKontrast $env:CK_VERSION" --notes-file release-body.txt --latest
